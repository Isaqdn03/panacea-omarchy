# Glass mode. The terminal's background opacity lives in its own file so the
# pill's switch (and SUPER + SHIFT + T) can flip it without ever rewriting this
# config; that file is written by, and only by,
# ~/.config/panacea/scripts/glass.sh.
#
# Appended last on purpose -- ghostty keeps the value it reads last, so this
# include wins over any background-opacity set above it.
#
# The `?` makes the include optional: lose the file and the terminal simply
# comes back opaque, which is the harmless half of the toggle.
config-file = ?"~/.config/ghostty/panacea-glass.conf"
